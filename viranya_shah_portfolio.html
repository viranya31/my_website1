<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viranya Shah - Interactive Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            box-sizing: border-box;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            pointer-events: auto;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #info-card {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            width: 90%;
            max-width: 600px;
            opacity: 0;
        }
        #info-card.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        #controls-help {
            position: absolute;
            top: 2rem;
            right: 2rem;
            text-align: right;
        }
        .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 4px 8px;
            margin: 2px;
            font-weight: 600;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="ui-layer">
        <div class="glass-panel w-fit">
            <h1 class="text-3xl font-bold tracking-tight text-white">Viranya Shah</h1>
            <p class="text-sm text-blue-300 mt-1 font-medium">Product Analyst | Product Manager | Data Scientist</p>
        </div>

        <div id="controls-help" class="glass-panel w-fit hidden md:block">
            <p class="text-sm font-semibold mb-2">Explore the Map</p>
            <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> or Arrows to Drive</div>
        </div>

        <div id="info-card" class="glass-panel shadow-2xl shadow-blue-500/20">
            <h2 id="card-title" class="text-2xl font-bold text-blue-400 mb-2">Title</h2>
            <div id="card-content" class="text-gray-200 text-sm leading-relaxed max-h-48 overflow-y-auto pr-2">
                Content goes here...
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const infoCard = document.getElementById('info-card');
        const cardTitle = document.getElementById('card-title');
        const cardContent = document.getElementById('card-content');

        let width, height;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input state
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        
        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Player (Vehicle) properties
        const player = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            speed: 0,
            maxSpeed: 8,
            friction: 0.92,
            acceleration: 0.6,
            angle: 0,
            width: 30,
            height: 50,
            color: '#3b82f6'
        };

        // Camera
        const camera = { x: 0, y: 0 };

        const zones = [
            {
                x: 0, y: -200, width: 120, height: 120, color: '#ec4899', icon: '🎓',
                title: 'Education',
                content: `
                    <ul class="list-disc pl-5 space-y-2">
                        <li><strong>FAU Erlangen-Nürnberg:</strong> MS, Data Science (Oct 2021 - Dec 2023)</li>
                        <li><strong>Gujarat Technological University:</strong> BE, Computer Science (Aug 2016 - Sep 2020)</li>
                    </ul>`
            },
            {
                x: -300, y: 150, width: 140, height: 140, color: '#f59e0b', icon: '💼',
                title: 'Recent Experience',
                content: `
                    <ul class="list-disc pl-5 space-y-2">
                        <li><strong>Amazon (Nuremberg):</strong> Delivery Manager (Nov 2024 - May 2025). Managed 3000 daily packages, 99% accuracy.</li>
                        <li><strong>Lieferando (Berlin):</strong> Customer Service Exec (Apr 2023 - Nov 2024). Handled 100+ live queries/shift.</li>
                    </ul>`
            },
            {
                x: 300, y: 150, width: 120, height: 120, color: '#10b981', icon: '📈',
                title: 'Previous Experience',
                content: `
                    <ul class="list-disc pl-5 space-y-2">
                        <li><strong>McDonald's (Erlangen):</strong> Inventory Manager (May 2022 - Apr 2023)</li>
                        <li><strong>Flink (Erlangen):</strong> Delivery Rider (Dec 2021 - Mar 2022)</li>
                        <li><strong>H & B Computer Education:</strong> Academic Tutor (SQL & Python)</li>
                        <li><strong>RSWM Limited:</strong> Network Intern</li>
                    </ul>`
            },
            {
                x: -200, y: -400, width: 100, height: 100, color: '#8b5cf6', icon: '⚡',
                title: 'Top Skills',
                content: `
                    <div class="flex flex-wrap gap-2 mt-2">
                        <span class="bg-white/20 px-3 py-1 rounded-full text-xs">SQL</span>
                        <span class="bg-white/20 px-3 py-1 rounded-full text-xs">Python</span>
                        <span class="bg-white/20 px-3 py-1 rounded-full text-xs">Excel</span>
                        <span class="bg-white/20 px-3 py-1 rounded-full text-xs">PowerPivot</span>
                        <span class="bg-white/20 px-3 py-1 rounded-full text-xs">Product Management</span>
                        <span class="bg-white/20 px-3 py-1 rounded-full text-xs">Data Science</span>
                    </div>`
            },
            {
                x: 200, y: -400, width: 100, height: 100, color: '#06b6d4', icon: '📬',
                title: 'Contact',
                content: `
                    <p class="mb-2">Let's connect!</p>
                    <p>📧 <a href="mailto:viranya911@gmail.com" class="text-blue-300 hover:underline">viranya911@gmail.com</a></p>
                    <p>🔗 <a href="https://www.linkedin.com/in/viranyashah" target="_blank" class="text-blue-300 hover:underline">linkedin.com/in/viranyashah</a></p>
                `
            }
        ];

        let activeZone = null;

        function update() {
            // Movement logic
            let moving = false;
            let targetAngle = player.angle;

            if (keys.w || keys.ArrowUp) { player.vy -= player.acceleration; moving = true; }
            if (keys.s || keys.ArrowDown) { player.vy += player.acceleration; moving = true; }
            if (keys.a || keys.ArrowLeft) { player.vx -= player.acceleration; moving = true; }
            if (keys.d || keys.ArrowRight) { player.vx += player.acceleration; moving = true; }

            // Apply friction
            player.vx *= player.friction;
            player.vy *= player.friction;

            // Cap speed
            const currentSpeed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
            if (currentSpeed > player.maxSpeed) {
                player.vx = (player.vx / currentSpeed) * player.maxSpeed;
                player.vy = (player.vy / currentSpeed) * player.maxSpeed;
            }

            // Update angle based on velocity if moving
            if (currentSpeed > 0.5) {
                player.angle = Math.atan2(player.vy, player.vx) + Math.PI / 2; // +90deg because car points up initially
            }

            player.x += player.vx;
            player.y += player.vy;

            // Camera smoothly follows player
            camera.x += (player.x - camera.x) * 0.1;
            camera.y += (player.y - camera.y) * 0.1;

            checkCollisions();
        }

        function checkCollisions() {
            let foundZone = null;
            const interactionRadius = 150;

            for (let zone of zones) {
                // Simple distance check from center of zone
                const dx = player.x - zone.x;
                const dy = player.y - zone.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < interactionRadius) {
                    foundZone = zone;
                    break;
                }
            }

            if (foundZone !== activeZone) {
                activeZone = foundZone;
                if (activeZone) {
                    cardTitle.innerText = activeZone.title;
                    cardTitle.style.color = activeZone.color;
                    cardContent.innerHTML = activeZone.content;
                    infoCard.classList.add('active');
                } else {
                    infoCard.classList.remove('active');
                }
            }
        }

        function drawGrid() {
            const gridSize = 100;
            const offsetX = -camera.x % gridSize;
            const offsetY = -camera.y % gridSize;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            for (let x = offsetX - width/2; x < width/2 + gridSize; x += gridSize) {
                ctx.moveTo(x + width/2, 0);
                ctx.lineTo(x + width/2, height);
            }
            for (let y = offsetY - height/2; y < height/2 + gridSize; y += gridSize) {
                ctx.moveTo(0, y + height/2);
                ctx.lineTo(width, y + height/2);
            }
            ctx.stroke();
        }

        function drawZones() {
            zones.forEach(zone => {
                const screenX = zone.x - camera.x + width / 2;
                const screenY = zone.y - camera.y + height / 2;

                // Draw glowing base
                ctx.shadowBlur = 30;
                ctx.shadowColor = zone.color;
                ctx.fillStyle = zone.color;
                ctx.globalAlpha = 0.2;
                ctx.beginPath();
                ctx.arc(screenX, screenY, zone.width/2 + 20, 0, Math.PI * 2);
                ctx.fill();

                // Draw platform
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#2a2a4a';
                ctx.strokeStyle = zone.color;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.roundRect(screenX - zone.width/2, screenY - zone.height/2, zone.width, zone.height, 16);
                ctx.fill();
                ctx.stroke();
                ctx.shadowBlur = 0; // reset

                // Draw Icon
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(zone.icon, screenX, screenY - 15);

                // Draw Title
                ctx.font = 'bold 16px Inter';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(zone.title, screenX, screenY + 25);
                
                // Draw interaction ring if active
                if(activeZone === zone) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, zone.width/2 + 40, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            });
        }

        function drawPlayer() {
            const screenX = width / 2 + (player.x - camera.x);
            const screenY = height / 2 + (player.y - camera.y);

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(player.angle);

            // Shadow
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 10;

            // Car body
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.roundRect(-player.width/2, -player.height/2, player.width, player.height, 8);
            ctx.fill();

            // Cockpit
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.roundRect(-player.width/2 + 4, -player.height/4, player.width - 8, player.height/2, 4);
            ctx.fill();
            
            // Headlights
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(-player.width/2 + 6, -player.height/2 + 4, 3, 0, Math.PI*2);
            ctx.arc(player.width/2 - 6, -player.height/2 + 4, 3, 0, Math.PI*2);
            ctx.fill();

            // Headlight Beams (if moving or just for style)
            ctx.globalAlpha = 0.15;
            ctx.beginPath();
            ctx.moveTo(-player.width/2 + 6, -player.height/2);
            ctx.lineTo(-player.width/2 - 20, -player.height/2 - 60);
            ctx.lineTo(-player.width/2 + 30, -player.height/2 - 60);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(player.width/2 - 6, -player.height/2);
            ctx.lineTo(player.width/2 - 30, -player.height/2 - 60);
            ctx.lineTo(player.width/2 + 20, -player.height/2 - 60);
            ctx.fill();

            ctx.restore();
        }

        function loop() {
            ctx.clearRect(0, 0, width, height);
            
            update();
            
            drawGrid();
            drawZones();
            drawPlayer();
            
            // Draw starting text prompt on floor if near origin
            if(Math.abs(player.x) < 200 && Math.abs(player.y) < 200) {
                 const screenX = -camera.x + width / 2;
                 const screenY = -camera.y + height / 2 + 100;
                 ctx.font = '20px Inter';
                 ctx.textAlign = 'center';
                 ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                 ctx.fillText('Drive around to explore my portfolio', screenX, screenY);
            }

            requestAnimationFrame(loop);
        }

        // Start game
        loop();
    </script>
</body>
</html>
